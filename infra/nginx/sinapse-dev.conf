server {
    listen 80;
    listen [::]:80;
    server_name abpt-dev.duckdns.org;
    root /var/www/sinapse;

    location /.well-known/acme-challenge/ { }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name abpt-dev.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/abpt-dev.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abpt-dev.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    #auth_basic "Sinapse DEV";
    #auth_basic_user_file /etc/nginx/.htpasswd-dev;

    client_max_body_size 5m;
    access_log /var/log/nginx/sinapse-dev.access.log;
    error_log  /var/log/nginx/sinapse-dev.error.log;

    root /var/www/sinapse;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
